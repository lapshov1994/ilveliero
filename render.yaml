version: '1'
services:
  - type: static
    name: ilveliero-1
    rootDir: artifacts/il-veliero
    buildCommand: pnpm install && pnpm run build
    publishPath: dist
    envVars:
      - key: PNPM_VERSION
        value: 9.1.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
